schema = 1
name = "Niederer electrophysiology benchmark (tetrahedra, h = 0.1 mm, dt = 0.005 ms)"
reference_source = "P8 activation times from the Sherlock svMultiPhysics study. Finest-resolution latest activation interval from Niederer et al. (2011), section 6a, doi:10.1098/rsta.2011.0139."

[preprocess.generate_mesh]
argv = ["python", "../../scripts/generate_mesh.py", "--case", "slab_h0.1_dt0.005"]

[solver.solve]
input = "solver.xml"

[postprocess.extract_activation]
argv = ["python", "../../scripts/benchmark.py", "extract", "slab_h0.1_dt0.005"]

[evaluation.p8_ms]
argv = ["python", "../../scripts/benchmark.py", "evaluate", "slab_h0.1_dt0.005", "p8_ms"]
reference = 40.254074404
atol = 0.10

[evaluation.latest_ms]
argv = ["python", "../../scripts/benchmark.py", "evaluate", "slab_h0.1_dt0.005", "latest_ms"]
reference = 43.25
# Rounded binary64 distance to either published endpoint, inclusive.
atol = 5.450000000000003

[cleanup.remove_snapshots]
argv = ["python", "../../scripts/benchmark.py", "cleanup", "slab_h0.1_dt0.005"]
