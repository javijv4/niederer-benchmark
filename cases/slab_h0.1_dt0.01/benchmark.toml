schema = 1
name = "Niederer electrophysiology benchmark (tetrahedra, h = 0.1 mm, dt = 0.01 ms)"
reference_source = "P8 activation times from the Sherlock svMultiPhysics study."

[preprocess.generate_mesh]
argv = ["python", "../../scripts/generate_mesh.py", "--case", "slab_h0.1_dt0.01"]

[solver.solve]
input = "solver.xml"

[postprocess.extract_activation]
argv = ["python", "../../scripts/benchmark.py", "extract", "slab_h0.1_dt0.01"]

[evaluation.p8_ms]
argv = ["python", "../../scripts/benchmark.py", "evaluate", "slab_h0.1_dt0.01", "p8_ms"]
reference = 40.547850479
atol = 0.10

[cleanup.remove_snapshots]
argv = ["python", "../../scripts/benchmark.py", "cleanup", "slab_h0.1_dt0.01"]
